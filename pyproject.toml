[project]
name = "seeder"
authors = [
    { name = "aswin", email = "aswin@softservedweb.com"}
]
description = "Seed ERPNext and HRMS sites with realistic, reproducible demo data"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=15.0.0" # Installed and managed by bench.
]

[build-system]
requires = ["flit_core >=3.4,<4"]
